<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5c7a5a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kinski" />
  <title>Kinski – Pflege</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div>
        <p class="eyebrow">Kinski</p>
        <h1 id="titleDate">Heute</h1>
      </div>
      <div class="top-actions">
        <button type="button" id="btnPrev" class="icon-btn" aria-label="Vorheriger Tag">‹</button>
        <button type="button" id="btnToday" class="chip-btn">Heute</button>
        <button type="button" id="btnNext" class="icon-btn" aria-label="Nächster Tag">›</button>
      </div>
    </header>

    <section id="overdueBanner" class="overdue-banner" hidden></section>
    <section id="progressBar" class="progress"></section>

    <main id="board" class="board"></main>

    <section class="journal-card">
      <label for="journal">Tagesnotiz</label>
      <textarea id="journal" rows="3" placeholder="Allgemeines, Verhalten, Auffälligkeiten …"></textarea>
    </section>

    <footer class="foot">
      <p>Daten bleiben auf diesem Gerät gespeichert. Offline nutzbar.</p>
      <button type="button" id="btnNotify" class="chip-btn">Erinnerungen erlauben</button>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
